# The narrow set of checks only real AWS can settle.
#
# Everything a fake can prove is proved in e2e.yml, for free, on every pull
# request. What is left here is the handful of claims that are about Amazon
# rather than about this code, and each of them has already cost somebody a
# debugging session:
#
#   - whether these credentials can invoke a model at all. An SCP denial, a
#     missing aws-marketplace:Subscribe and a wrong identifier all arrive as the
#     same AccessDenied, and one real request is what tells them apart.
#   - what the catalogue says today: which models are profile-only, which have
#     gone LEGACY, and which regions each profile may route to.
#   - what the Price List API says today, and in what shape.
#   - which beta flags Bedrock still refuses. That list is hardcoded, it changes
#     underneath the product without warning, and a wrong entry either breaks
#     every request or silently drops a feature somebody is paying for.
#
# Every request it makes asks for one token, so a run costs a fraction of a
# cent.
name: Live Bedrock

on:
  push:
    branches: [main]
  # A workflow_dispatch is only offered for a file that already exists on the
  # default branch, so a change to this job that needs proving before it lands
  # is tried by naming its branch under push above - and adding that branch to
  # the aws-tests environment's deployment branches for as long as it takes,
  # since the environment admits main only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-live-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # The region this deployment runs in, so what is checked is what is served.
  AWS_REGION: ap-southeast-1
  # A repository variable, so the tree names no AWS account.
  AWS_ROLE_ARN: ${{ vars.PRICES_ROLE_ARN }}

jobs:
  live:
    name: Against real Bedrock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Runs only where the repository variable PUBLISH is 'true': this
    # repository and the public one, never a fork, which does not have it and
    # sees the job skipped rather than failed. The guard is not the security
    # boundary - the environment is, because the role's trust admits only this
    # environment's subject - so a fork that sets the variable fails at the
    # AWS login, which is the right outcome.
    if: vars.PUBLISH == 'true'

    # The role trusts this environment's subject, and the environment admits
    # main only, so adding pull_request to the triggers above would still hand
    # credentials to nobody.
    environment: aws-tests

    permissions:
      contents: read
      # Required for the OIDC trust with AWS. Nothing here needs write access
      # to the repository.
      id-token: write

    steps:
      - name: The variables are set
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::repository variable PRICES_ROLE_ARN is not set (see the env block of bedrock-live.yml)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/app/package-lock.json

      - name: Build the console
        working-directory: ui/app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # What this run actually claims to be.
      #
      # AWS returns the same "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity" whether a trust policy rejected the
      # subject or the role does not exist, deliberately, so that a stranger
      # cannot enumerate roles. That makes the message useless for telling the
      # two apart, and this prints the half GitHub controls: the exact subject,
      # audience and issuer the token carries, which is what a trust policy
      # matches on.
      #
      # The token is a credential and is never echoed - only its middle segment,
      # decoded, which is public claims and no signature.
      - name: What identity this run presents
        run: |
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "::add-mask::$token"
          claims=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ r = length($0) % 4; if (r == 2) print $0 "=="; else if (r == 3) print $0 "="; else print $0 }' \
            | base64 -d 2>/dev/null)
          echo "$claims" | jq '{iss, aud, sub, repository, repository_owner, ref, workflow}'
          echo "the trust policy must admit the sub above, and the provider's"
          echo "client-id list must contain the aud above"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: panorama-live-${{ github.run_id }}

      - name: Who are we
        run: aws sts get-caller-identity

      # The checks that need a model invoked, and the only step that spends
      # anything: every request it makes asks for one output token.
      #
      # First, because a step that fails stops the job and these are the ones
      # no amount of API inspection can replace - whether these credentials can
      # invoke anything at all, and whether the beta flags this build drops are
      # still the ones Bedrock refuses.
      - name: End-to-end against live Bedrock
        env:
          PANORAMA_TEST_AWS_REGION: ${{ env.AWS_REGION }}
        run: go test -tags 'e2e live' -count=1 -v -timeout 15m -run TestLive ./test/e2e/...

      # The provider's own live checks: the catalogue, and the Price List API.
      # TestFetchAgainstLiveAWS already existed and is gated on this variable;
      # running it here is what keeps it from rotting.
      #
      # Its scope-pair assertions do not hold in every region: this one prices
      # eleven models globally and seven regionally for disjoint sets, so
      # nothing pairs and the test reports the split as moved. That is a fact
      # about which models the region offers rather than a regression, and it
      # is last so it cannot stop the checks above from running.
      - name: Provider against live AWS
        env:
          PANORAMA_TEST_AWS_REGION: ${{ env.AWS_REGION }}
        run: go test -count=1 -v -timeout 15m ./internal/providers/bedrock/...
