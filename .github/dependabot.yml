# Weekly, grouped per ecosystem, so an update is one pull request to review
# rather than twenty.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /ui/app
    schedule: { interval: weekly }
    groups:
      console: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
    groups:
      docs: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
