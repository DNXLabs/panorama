# Licensing for files that cannot carry an SPDX header (data, images, fonts,
# lock files, Markdown). A source file carries its own header; `make
# license-check` (reuse lint) fails while any tracked file has neither.
version = 1

[[annotations]]
path = [
  "**.md",
  "**.json",
  "**.svg",
  "go.mod",
  "go.sum",
  "ui/app/index.html",
  "deploy/compose/dev/**",
  "internal/providers/bedrock/testdata/**",
  "EDITIONS.md",
  "NOTICE",
  "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DNX Technology Pty Ltd and contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# The manual: prose, screenshots and diagrams. Code samples within the pages
# stay AGPL-3.0-only, which docs/README.md and every page's footer say.
[[annotations]]
path = [
  "docs/src/content/**",
  "docs/src/assets/console/**",
  "docs/src/assets/diagrams/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 DNX Technology Pty Ltd and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "docs/src/assets/fonts/jetbrains-mono-*"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "docs/src/assets/fonts/lexend-*"
precedence = "override"
SPDX-FileCopyrightText = "2019 The Lexend Project Authors (https://github.com/googlefonts/lexend)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "docs/src/assets/fonts/questrial-*"
precedence = "override"
SPDX-FileCopyrightText = "2011 The Questrial Project Authors (https://github.com/googlefonts/questrial)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "docs/src/assets/fonts/tomorrow-*"
precedence = "override"
SPDX-FileCopyrightText = "2019 The Tomorrow Project Authors (https://github.com/MonicaRizzolli/Tomorrow)"
SPDX-License-Identifier = "OFL-1.1"

# Public AWS documentation pages, kept verbatim as the price finder's fixtures.
[[annotations]]
path = "internal/pricefinder/testdata/**"
precedence = "override"
SPDX-FileCopyrightText = "Amazon.com, Inc. or its affiliates"
SPDX-License-Identifier = "LicenseRef-AWS-Documentation"
